<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Cobros</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; padding: 20px; color: #333; }
.header { background: linear-gradient(135deg, #1F4E79, #2E75B6); color: white; padding: 25px 30px; border-radius: 12px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; }
.header h1 { font-size: 28px; font-weight: 700; letter-spacing: 0.5px; }
.header span { font-size: 14px; opacity: 0.85; }
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; margin-bottom: 28px; }
.kpi-card { background: white; border-radius: 10px; padding: 18px 16px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-left: 4px solid #2E75B6; }
.kpi-card .label { font-size: 12px; text-transform: uppercase; color: #888; letter-spacing: 0.5px; }
.kpi-card .value { font-size: 28px; font-weight: 700; color: #1F4E79; margin: 4px 0; }
.kpi-card .sub { font-size: 12px; color: #999; }
.kpi-card.danger { border-left-color: #c0392b; }
.kpi-card.danger .value { color: #c0392b; }
.kpi-card.success { border-left-color: #27ae60; }
.kpi-card.success .value { color: #27ae60; }
.kpi-card.warning { border-left-color: #f39c12; }
.chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
.chart-box { background: white; border-radius: 10px; padding: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.chart-box h3 { font-size: 15px; margin-bottom: 12px; color: #1F4E79; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { background: #1F4E79; color: white; padding: 10px 8px; text-align: center; font-weight: 600; }
td { padding: 8px; border-bottom: 1px solid #e0e0e0; text-align: center; }
tr:nth-child(even) { background: #f7f9fc; }
tr:hover { background: #e8f0fa; }
.section-title { font-size: 18px; font-weight: 700; color: #1F4E79; margin: 20px 0 12px; }
.top-mora { color: #c0392b; font-weight: 600; }
@media (max-width: 768px) { .chart-row { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="header">
  <div><h1>REPORTE DE COBROS</h1><span>Dashboard ejecutivo &mdash; Datos al 30/07/2026</span></div>
  <div style="text-align:right"><a href="Reporte_Cobros.xlsx" style="color:white;background:rgba(255,255,255,0.2);padding:8px 16px;border-radius:6px;text-decoration:none;font-size:14px">Descargar Excel</a></div>
</div>

<script>
const DATA = {
  totalCuentas: 33969,
  alDia: { val: 19855, pct: 58.5 },
  enMora: { val: 10676, pct: 31.4 },
  ceroPago: { val: 2552, pct: 7.5 },
  moraReal: { val: 886, pct: 2.6 },
  totalVentas: 7984300,
  promDiasMora: 817,
  totalLlamadas: 4055,
  statusCuentas: [
    ["Al d\u00eda", 19855],
    ["Mora", 10676],
    ["Cero Pago", 2552],
    ["Mora Real", 886],
  ],
  resultadoLlamadas: [
    ["Auto busy", 1392],
    ["Agent No Disponible", 866],
    ["Buzon de voz", 416],
    ["No Answer", 399],
    ["Cliente al d\u00eda", 346],
    ["Volver a llamar", 309],
    ["Cuenta cesada", 113],
    ["Call Back", 80],
    ["Otros", 134],
  ],
  topDeudores: [
    ["Magdalena Rodriguez", 1932, "$202"],
    ["Roberto Tatom", 1925, "$163"],
    ["Janeth Cordoba Rudas", 1913, "$154"],
    ["Anadid Martinez", 1912, "$172"],
    ["Jose Jaen De Gracia", 1911, "$134"],
    ["Emili Madrid Guerra", 1911, "$154"],
    ["Floriseth Caballero", 1909, "$157"],
    ["Cesar Cedeno Penalba", 1908, "$157"],
    ["Daniel Rodriguez", 1908, "$98"],
    ["Victor Lorenzo Abrego", 1906, "$134"],
  ]
};

const formatter = new Intl.NumberFormat('en-US');
const money = v => '$' + formatter.format(v);

document.write(`
<div class="kpi-grid">
  <div class="kpi-card">
    <div class="label">Total Cuentas</div>
    <div class="value">${formatter.format(DATA.totalCuentas)}</div>
    <div class="sub">Clientes registrados</div>
  </div>
  <div class="kpi-card success">
    <div class="label">Al D\u00eda</div>
    <div class="value">${formatter.format(DATA.alDia.val)}</div>
    <div class="sub">${DATA.alDia.pct}% del total</div>
  </div>
  <div class="kpi-card danger">
    <div class="label">En Mora</div>
    <div class="value">${formatter.format(DATA.enMora.val + DATA.ceroPago.val + DATA.moraReal.val)}</div>
    <div class="sub">${(DATA.enMora.pct + DATA.ceroPago.pct + DATA.moraReal.pct).toFixed(1)}% del total</div>
  </div>
  <div class="kpi-card">
    <div class="label">Ventas Totales</div>
    <div class="value">${money(DATA.totalVentas)}</div>
    <div class="sub">Suma financiada</div>
  </div>
  <div class="kpi-card warning">
    <div class="label">Llamadas Realizadas</div>
    <div class="value">${formatter.format(DATA.totalLlamadas)}</div>
    <div class="sub">Reporte de gesti\u00f3n</div>
  </div>
  <div class="kpi-card danger">
    <div class="label">D\u00edas Prom. Mora</div>
    <div class="value">${formatter.format(DATA.promDiasMora)}</div>
    <div class="sub">Promedio de atraso</div>
  </div>
</div>
`);
</script>

<div class="chart-row">
  <div class="chart-box">
    <h3>Estado de Cuentas</h3>
    <canvas id="pieStatus"></canvas>
  </div>
  <div class="chart-box">
    <h3>Resultado de Llamadas</h3>
    <canvas id="barLlamadas"></canvas>
  </div>
</div>

<div class="section-title">TOP 10 DEUDORES (mayor atraso)</div>
<table id="topTable">
  <thead><tr><th>#</th><th>Nombre</th><th>D\u00edas Atraso</th><th>Monto</th></tr></thead>
  <tbody></tbody>
</table>

<div class="section-title" style="margin-top:20px">Marcas m&aacute;s frecuentes</div>
<div class="chart-box" style="max-width:600px">
  <canvas id="barMarcas"></canvas>
</div>

<script>
new Chart(document.getElementById('pieStatus'), {
  type: 'doughnut',
  data: {
    labels: DATA.statusCuentas.map(r => r[0]),
    datasets: [{
      data: DATA.statusCuentas.map(r => r[1]),
      backgroundColor: ['#27ae60','#e74c3c','#f39c12','#95a5a6'],
      borderWidth: 0
    }]
  },
  options: { plugins: { legend: { position: 'bottom' }, tooltip: { callbacks: { label: ctx => ctx.parsed + ' cuentas (' + (ctx.parsed/DATA.totalCuentas*100).toFixed(1) + '%)' } } }, cutout: '55%' }
});

new Chart(document.getElementById('barLlamadas'), {
  type: 'bar',
  data: {
    labels: DATA.resultadoLlamadas.map(r => r[0]),
    datasets: [{
      label: 'Llamadas',
      data: DATA.resultadoLlamadas.map(r => r[1]),
      backgroundColor: '#2E75B6',
      borderRadius: 4
    }]
  },
  options: { indexAxis: 'y', responsive: true, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false } }, y: { grid: { display: false } } } }
});

const topTbody = document.querySelector('#topTable tbody');
DATA.topDeudores.forEach((d,i) => {
  const tr = document.createElement('tr');
  tr.innerHTML = `<td>${i+1}</td><td class="top-mora">${d[0]}</td><td>${formatter.format(d[1])}</td><td>${d[2]}</td>`;
  topTbody.appendChild(tr);
});

new Chart(document.getElementById('barMarcas'), {
  type: 'bar',
  data: {
    labels: ['Samsung','Honor','Xiaomi','L.Blanca','Tecno','TV','Realme','HP','RCA','Sankey'],
    datasets: [{
      label: 'Cantidad',
      data: [14617, 10555, 3771, 2073, 577, 562, 410, 245, 135, 132],
      backgroundColor: ['#1F4E79','#2E75B6','#5B9BD5','#A8C7E7','#8DB4E2','#6B9BCF','#4A7FB5','#35689E','#1F4E79','#163B5E'],
      borderRadius: 4
    }]
  },
  options: { indexAxis: 'y', responsive: true, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false } }, y: { grid: { display: false } } } }
});
</script>
</body>
</html>
